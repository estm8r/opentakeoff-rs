[package]
name = "opentakeoff-rs"
version = "0.1.0"
edition = "2021"
authors = ["Marcus Hantla <estm8r>"]
description = "Rust rewrite of OpenTakeoff: native construction quantity takeoff from PDF blueprints"
license = "AGPL-3.0"
repository = "https://github.com/estm8r/opentakeoff-rs"
readme = "README.md"

[dependencies]
geo = "0.28"
geo-types = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"

[dev-dependencies]
approx = "0.5"
